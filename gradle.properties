org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

maven_group=io.github.u2894638479
archives_base_name=KotlinMCUI-window
license=MIT
mod_version=1.0.0-alpha.1
mod_id=kotlinmcuiwindow
mod_name=KotlinMCUI-window
mod_description=Swing window backend for kotlinmcui
mod_authors=2894638479
mod_github=https://github.com/2894638479/KotlinMCUI-window
mod_issues=https://github.com/2894638479/KotlinMCUI-window/issues
icon=assets/kotlinmcuiwindow/icon.png

# The core library is compiled on 21 and ships Java 8 bytecode, so the same split is kept here:
# the toolchain is what runs the build, the target is what the game loads.
toolkit_version=21
# Spelled the way both enums are looked up: `JVM_1_8` for Kotlin and `VERSION_1_8` for Java.
java_version=1_8

kotlin_version=2.4.20

kotlinmcui_version=1.0.0-alpha.32

# Only the entry points are compiled against these, and each loader supplies its own at runtime:
# one jar carries all three, and a loader that is absent simply never loads its entry class.
fabric_loader_version=0.19.5
# Forge publishes the classes under a classifier plus two FML modules; `fancymodloader` is where
# NeoForge keeps `net.neoforged.fml`, and the two event buses are separate artifacts.
forge_version=1.20.1-47.4.6
forge_eventbus_version=6.0.5
neoforge_loader_version=4.0.42
neoforge_bus_version=8.0.5

# Pinned to the floor the supported game versions ship, exactly as the core library pins them.
slf4j_version=2.0.1
fastutil_version=8.5.9
coroutines_version=1.11.0
serialization_version=1.11.0
