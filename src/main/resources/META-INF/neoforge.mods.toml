issueTrackerURL = "${mod_issues}"
license = "${license}"

# Kotlin for Forge's language loader id. lowcodefml is not the same thing: a mod with an
# @Mod class loaded through it never gets that class constructed.
modLoader = "kotlinforforge"
loaderVersion = "[0,)"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''
# The key kept the Forge spelling: NeoForge's own parser reads `logoFile`, and has no `iconFile` at
# all, so both metadata files name the icon the same way.
logoFile = "${icon}"

# Required, because it is the loader above that reads this jar's @Mod class: without Kotlin for
# Forge there is nothing to construct the entry point. Left to the 5.x line the loader id was
# verified against (5.12.0 on NeoForge 21.1.219), since its language loader is not stable across
# major versions.
[[dependencies.${mod_id}]]
modId = "kotlinforforge"
type = "required"
versionRange = "[5,6)"
ordering = "NONE"
side = "CLIENT"

# Same two requirements as the Forge file; NeoForge replaced `mandatory` with `type` in 1.20.5.
[[dependencies.${mod_id}]]
modId = "kotlinmcui"
type = "required"
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "kotlinmcuibackend"
type = "required"
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"
